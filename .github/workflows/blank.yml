name: Build and Deploy GitBook

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout repo
      # ----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # Use OLD node version (GitBook safe)
      # ----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 10

      # ----------------------------
      # Install GitBook CLI
      # ----------------------------
      - name: Install GitBook
        run: |
          npm install -g gitbook-cli
          gitbook install

      # ----------------------------
      # Build GitBook
      # ----------------------------
      - name: Build Book
        run: gitbook build . ./_book

      # ----------------------------
      # Inject FontAwesome (Reliable Load)
      # ----------------------------
      - name: Inject FontAwesome
        run: |
          find _book -name "*.html" | while read file; do
            sed -i 's|</head>|<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>|' "$file"
          done

      # ----------------------------
      # Auto Sidebar Icon Injection
      # ----------------------------
      - name: Inject Sidebar Icons
        run: |

          FILE="_book/summary.html"

          declare -A ICON_MAP=(
            ["Theme Settings"]="sliders"
            ["Buttons"]="toggle-off"
            ["Colors"]="palette"
            ["Typography"]="font"
            ["Cart"]="cart-plus"
            ["Header"]="bars"
            ["Footer"]="copyright"
            ["Navigation Menu"]="indent"
            ["Collections"]="table-cells-large"
            ["Products"]="film"
            ["Blog"]="warehouse"
            ["Pages"]="file-lines"
            ["Filters"]="filter"
          )

          for TITLE in "${!ICON_MAP[@]}"; do
            ICON=${ICON_MAP[$TITLE]}

            sed -i "s|<a[^>]*>$TITLE|<a><i class=\"fa-solid fa-$ICON\"></i> $TITLE|Ig" "$FILE"
          done

      # ----------------------------
      # Fix GitHub Pages Relative Path
      # ----------------------------
      - name: Fix GitHub Pages Path
        run: |
          find _book -name "*.html" | while read file; do
            sed -i 's|href="/|href="./|g' "$file"
            sed -i 's|src="/|src="./|g' "$file"
          done

      # ----------------------------
      # Deploy to gh-pages
      # ----------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
