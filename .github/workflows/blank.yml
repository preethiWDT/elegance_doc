name: Build and Deploy GitBook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v3


      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '10'


      - name: Install GitBook
        run: |
          npm install -g gitbook-cli
          gitbook fetch 3.2.2


      - name: Build GitBook
        run: |
          gitbook install
          gitbook build


# -------------------------
# Inject FontAwesome
# -------------------------

      - name: Inject FontAwesome
        run: |
          find _book -name "*.html" | while read file; do
            sed -i '/font-awesome/d' "$file"
            sed -i 's|</head>|<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>|' "$file"
          done


# -------------------------
# AUTO SIDEBAR ICON ENGINE
# -------------------------

      - name: Auto Inject Sidebar Icons
        run: |

          SUMMARY="_book/summary.html"

          # Remove existing icons to avoid duplicates
          sed -i 's/<i class="fa-solid[^>]*><\/i>//g' $SUMMARY

          # Auto icon based on filename keywords
          declare -A ICONS=(
            ["button"]="toggle-off"
            ["color"]="palette"
            ["typography"]="font"
            ["cart"]="cart-shopping"
            ["header"]="bars"
            ["footer"]="copyright"
            ["menu"]="indent"
            ["navigation"]="indent"
            ["collection"]="table-cells"
            ["product"]="film"
            ["blog"]="pen"
            ["page"]="file-lines"
            ["filter"]="filter"
            ["setting"]="sliders"
          )

          for KEY in "${!ICONS[@]}"; do
            ICON=${ICONS[$KEY]}

            sed -i "s|\(<a href=\"[^\"]*$KEY[^\"]*\"[^>]*>\)|\1<i class=\"fa-solid fa-$ICON\"></i> |Ig" "$SUMMARY"

          done


# -------------------------
# Fix GitHub Pages Asset Paths
# -------------------------

      - name: Fix Asset Paths
        run: |
          find _book -name "*.html" | while read file; do
            sed -i 's|href="/|href="./|g' "$file"
            sed -i 's|src="/|src="./|g' "$file"
          done


# -------------------------
# Deploy
# -------------------------

      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          force: true
