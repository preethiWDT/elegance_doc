name: Build and Deploy GitBook

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 10

      - run: |
          npm install -g gitbook-cli
          gitbook fetch 3.2.2
          gitbook install
          gitbook build


# ----------------------------
# Inject FontAwesome
# ----------------------------

      - name: Inject FontAwesome
        run: |
          find _book -name "*.html" | while read FILE; do
            sed -i 's|</head>|<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>|' "$FILE"
          done


# ----------------------------
# Inject Sidebar Icons (MULTILINE SAFE)
# ----------------------------

      - name: Inject Sidebar Icons
        run: |

          declare -A ICONS=(
            ["blogs"]="pen"
            ["collection"]="table-cells"
            ["gallery"]="image"
            ["product"]="film"
            ["header"]="bars"
            ["footer"]="copyright"
            ["menu"]="indent"
            ["filter"]="filter"
            ["setting"]="sliders"
          )

          find _book -name "*.html" | while read FILE; do

            for KEY in "${!ICONS[@]}"; do
              ICON=${ICONS[$KEY]}

              perl -0777 -pi -e "s|(<a href=\"[^\"]*$KEY[^\"]*\"[^>]*>)|\1<i class=\"fa-solid fa-$ICON\"></i> |ig" "$FILE"

            done

          done


# ----------------------------
# Deploy
# ----------------------------

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
