name: Build and Deploy GitBook

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # KEEP Node 10 (GitBook needs it)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '10'

      - name: Install GitBook
        run: |
          npm install -g gitbook-cli
          gitbook fetch 3.2.2

      # -----------------------------
      # AUTO SUMMARY GENERATION
      # -----------------------------
      - name: Auto Generate SUMMARY
        run: |
          echo "# Summary" > SUMMARY.md
          echo "" >> SUMMARY.md

          find . -name "*.md" ! -name "README.md" ! -name "SUMMARY.md" | sort | while read file; do
            title=$(basename "$file" .md | sed 's/-/ /g' | sed 's/\b\w/\U&/g')
            echo "* [$title]($file)" >> SUMMARY.md
          done

      # -----------------------------
      # SIMPLE MARKDOWN CLEANUP
      # -----------------------------
      - name: Clean Markdown
        run: |
          find . -type f -name "*.md" | while read file; do

            # Convert hint blocks
            sed -i 's/{% hint style="[^"]*" %}/> **TIP:** /g' "$file"
            sed -i 's/{% hint %}/> **INFO:** /g' "$file"
            sed -i 's/{% endhint %}/\n/g' "$file"

            # Remove template vars
            sed -i 's/{{[^}]*}}//g' "$file"

          done

      # -----------------------------
      # Create book.json
      # -----------------------------
      - name: Create book.json
        run: |
          cat << 'EOF' > book.json
          {
            "title": "Documentation",
            "plugins": [
              "-search",
              "fontsettings",
              "theme-default"
            ],
            "pluginsConfig": {
              "fontsettings": {
                "theme": "white"
              }
            },
            "styles": {
              "website": "styles/website.css"
            }
          }
          EOF

      # -----------------------------
      # Add FontAwesome + Styles
      # -----------------------------
      - name: Add Styles
        run: |
          mkdir -p styles

          cat << 'EOF' > styles/website.css
          @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css');

          .markdown-section h1 i,
          .markdown-section h2 i {
            margin-right: 8px;
            color: #555;
          }
          EOF

      # -----------------------------
      # BUILD GITBOOK
      # -----------------------------
      - name: Build GitBook
        run: |
          gitbook install
          gitbook build

      # -----------------------------
      # AUTO ICON INJECTION (POST BUILD)
      # -----------------------------
      - name: Auto Insert Icons Into HTML
        run: |
          cd _book

          find . -name "*.html" | while read file; do
            filename=$(basename "$file" .html | tr '[:upper:]' '[:lower:]')

            # Auto icon = filename
            sed -i "0,/<h1>/s|<h1>|<h1><i class=\"fa-solid fa-$filename\"></i> |" "$file"
          done

      # -----------------------------
      # FIX GITHUB PAGES PATH
      # -----------------------------
      - name: Fix Asset Paths
        run: |
          sed -i 's|/gitbook/|gitbook/|g' _book/**/*.html || true

      # -----------------------------
      # DEPLOY
      # -----------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          force: true
